<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="80" height="80">
  <defs>
    <radialGradient id="diceGrad" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#ff3b4e"/>
      <stop offset="45%" stop-color="#d90429"/>
      <stop offset="85%" stop-color="#800016"/>
      <stop offset="100%" stop-color="#4d000d"/>
    </radialGradient>
    <linearGradient id="bevelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.7)"/>
      <stop offset="50%" stop-color="rgba(255,255,255,0.1)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.5)"/>
    </linearGradient>
    <filter id="diceShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="6" stdDeviation="4" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="pipShadow">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#330005" flood-opacity="0.8"/>
    </filter>
  </defs>
  <!-- Die body -->
  <rect x="8" y="8" width="84" height="84" rx="18" fill="url(#diceGrad)" filter="url(#diceShadow)"/>
  <!-- Beveled rim highlight -->
  <rect x="9" y="9" width="82" height="82" rx="17" fill="none" stroke="url(#bevelGrad)" stroke-width="2"/>
  <!-- Corner gloss -->
  <path d="M12 26 C12 18 18 12 26 12 L45 12 C30 18 20 30 16 45 Z" fill="rgba(255,255,255,0.3)"/>
  <!-- Pips -->
  
        <circle cx="30" cy="26" r="8" fill="#ffffff" filter="url(#pipShadow)"/>
        <circle cx="30" cy="26" r="6" fill="#f0f4f8"/>
        <circle cx="30" cy="26" r="3" fill="#e2e8f0"/>
        
        <circle cx="70" cy="26" r="8" fill="#ffffff" filter="url(#pipShadow)"/>
        <circle cx="70" cy="26" r="6" fill="#f0f4f8"/>
        <circle cx="70" cy="26" r="3" fill="#e2e8f0"/>
        
        <circle cx="30" cy="50" r="8" fill="#ffffff" filter="url(#pipShadow)"/>
        <circle cx="30" cy="50" r="6" fill="#f0f4f8"/>
        <circle cx="30" cy="50" r="3" fill="#e2e8f0"/>
        
        <circle cx="70" cy="50" r="8" fill="#ffffff" filter="url(#pipShadow)"/>
        <circle cx="70" cy="50" r="6" fill="#f0f4f8"/>
        <circle cx="70" cy="50" r="3" fill="#e2e8f0"/>
        
        <circle cx="30" cy="74" r="8" fill="#ffffff" filter="url(#pipShadow)"/>
        <circle cx="30" cy="74" r="6" fill="#f0f4f8"/>
        <circle cx="30" cy="74" r="3" fill="#e2e8f0"/>
        
        <circle cx="70" cy="74" r="8" fill="#ffffff" filter="url(#pipShadow)"/>
        <circle cx="70" cy="74" r="6" fill="#f0f4f8"/>
        <circle cx="70" cy="74" r="3" fill="#e2e8f0"/>
        
</svg>